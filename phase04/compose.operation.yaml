services:
  nginx:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  api:
    logging: *default-logging

  worker:
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks:celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging: *default-logging

  db:
    logging: *default-logging

  pgadmin:
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/misc/ping')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  redis:
    logging: *default-logging

  keycloak:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /realms/phase03 HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging: *default-logging

  prometheus:
    healthcheck:
      test: ["CMD", "promtool", "query", "instant", "http://localhost:9090", "up"]
      interval: 15s
      timeout: 5s
      retries: 12
    logging: *default-logging

  grafana:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://localhost:3000/api/health |
          grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging