apiVersion: v1
kind: ConfigMap
metadata: {name: phase06-api-config, namespace: phase06-app}
data:
  POSTGRES_DB: appdb
  POSTGRES_USER: appuser
  KEYCLOAK_ISSUER: http://phase06.localhost:18081/auth/realms/phase03
  KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/phase03/protocol/openid-connect/certs
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: phase06-app}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - name: api
        image: phase06-api:1.0
        imagePullPolicy: Never
        envFrom: [{configMapRef: {name: phase06-api-config}}, {secretRef: {name: phase06-db-secret}}]
        ports: [{containerPort: 8000}]
        readinessProbe: {httpGet: {path: /api/health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: phase06-app}
spec: {selector: {app: api}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: phase06-app}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - {name: frontend, image: 'phase06-frontend:1.0', imagePullPolicy: Never, ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: phase06-app}
spec: {selector: {app: frontend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phase06-web
  namespace: phase06-app
  annotations: {nginx.ingress.kubernetes.io/proxy-buffer-size: 16k}
spec:
  ingressClassName: nginx
  rules:
  - host: phase06.localhost
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 8000}}}}
      - {path: /auth, pathType: Prefix, backend: {service: {name: keycloak, port: {number: 8080}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 80}}}}