apiVersion: v1
kind: ConfigMap
metadata: {name: phase06-db-config, namespace: phase06-app}
data: {POSTGRES_DB: appdb, POSTGRES_USER: appuser}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: phase06-app, labels: {app: db}}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: phase06-app, labels: {app: db}}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom: [{configMapRef: {name: phase06-db-config}}, {secretRef: {name: phase06-db-secret}}]
        ports: [{containerPort: 5432}]
        readinessProbe: {exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}, initialDelaySeconds: 5, periodSeconds: 5}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: phase06-app, labels: {app: db}}
spec: {selector: {app: db}, ports: [{port: 5432, targetPort: 5432}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: redis-data, namespace: phase06-app, labels: {app: redis}}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 512Mi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: phase06-app, labels: {app: redis}}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: [redis-server, --appendonly, "yes"]
        ports: [{containerPort: 6379}]
        readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 3, periodSeconds: 5}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: redis-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: phase06-app, labels: {app: redis}}
spec: {selector: {app: redis}, ports: [{port: 6379, targetPort: 6379}]}