apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: docker-aws-study, namespace: argocd}
spec:
  project: default
  source: {repoURL: 'https://github.com/aitlabo2026/docker-aws-study.git', targetRevision: 'main', path: phase12/gitops/overlays/prod}
  destination: {server: 'https://kubernetes.default.svc', namespace: 'phase09-app'}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false]