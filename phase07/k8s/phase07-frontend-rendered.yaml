---
# Source: phase07-frontend/templates/service.yaml
apiVersion: v1
kind: Service
metadata: {name: 'phase07-frontend', labels: {app.kubernetes.io/managed-by: Helm}}
spec:
  selector: {app: 'phase07-frontend'}
  ports: [{port: 80, targetPort: 80}]
---
# Source: phase07-frontend/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: 'phase07-frontend', labels: {app.kubernetes.io/managed-by: Helm}}
spec:
  replicas: 2
  selector: {matchLabels: {app: 'phase07-frontend'}}
  template:
    metadata: {labels: {app: 'phase07-frontend'}}
    spec:
      containers:
      - name: frontend
        image: 'phase06-frontend:1.0'
        imagePullPolicy: Never
        ports: [{containerPort: 80}]
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 3}
        livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 10}
---
# Source: phase07-frontend/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: 'phase07-frontend', labels: {app.kubernetes.io/managed-by: Helm}}
spec:
  ingressClassName: nginx
  rules:
  - host: phase07.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: 'phase07-frontend', port: {number: 80}}}