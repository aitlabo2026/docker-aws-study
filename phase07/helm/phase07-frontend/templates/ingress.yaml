apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: '{{ .Release.Name }}', labels: {app.kubernetes.io/managed-by: Helm}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: '{{ .Release.Name }}', port: {number: {{ .Values.service.port }}}}}