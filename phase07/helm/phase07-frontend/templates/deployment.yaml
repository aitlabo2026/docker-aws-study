apiVersion: apps/v1
kind: Deployment
metadata: {name: '{{ .Release.Name }}', labels: {app.kubernetes.io/managed-by: Helm}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: '{{ .Release.Name }}'}}
  template:
    metadata: {labels: {app: '{{ .Release.Name }}'}}
    spec:
      containers:
      - name: frontend
        image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports: [{containerPort: 80}]
        resources:
{{ toYaml .Values.resources | indent 10 }}
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 3}
        livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 10}