apiVersion: v1
kind: ConfigMap
metadata: {name: phase09-api-config, namespace: phase09-app}
data: {POSTGRES_HOST: db, POSTGRES_DB: appdb, POSTGRES_USER: appuser, REDIS_HOST: redis, KEYCLOAK_ISSUER: 'http://localhost:18090/auth/realms/phase03', KEYCLOAK_JWKS_URL: 'http://keycloak:8080/auth/realms/phase03/protocol/openid-connect/certs'}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: phase09-gateway-config, namespace: phase09-app}
data:
  default.conf: |
    server {
      listen 80;
      location /api/ { proxy_pass http://api:8000; }
      location /docs { proxy_pass http://api:8000/docs; }
      location /openapi.json { proxy_pass http://api:8000/openapi.json; }
      location /auth/ { proxy_pass http://keycloak:8080; }
      location / { proxy_pass http://frontend:80; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: phase09-app}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - {name: api, image: '454229053884.dkr.ecr.ap-northeast-1.amazonaws.com/docker-aws-study/api:phase09-v1', ports: [{containerPort: 8000}], envFrom: [{configMapRef: {name: phase09-api-config}}, {secretRef: {name: phase09-db-secret}}], readinessProbe: {httpGet: {path: /api/health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 5}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: phase09-app}
spec: {selector: {app: api}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: phase09-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
      - {name: worker, image: '454229053884.dkr.ecr.ap-northeast-1.amazonaws.com/docker-aws-study/api:phase09-v1', command: [celery, -A, 'app.tasks:celery_app', worker, --loglevel=info], envFrom: [{configMapRef: {name: phase09-api-config}}, {secretRef: {name: phase09-db-secret}}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: phase09-app}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template: {metadata: {labels: {app: frontend}}, spec: {containers: [{name: frontend, image: '454229053884.dkr.ecr.ap-northeast-1.amazonaws.com/docker-aws-study/frontend:phase09-v1', ports: [{containerPort: 80}]}]}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: phase09-app}
spec: {selector: {app: frontend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: phase09-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
      - {name: nginx, image: 'nginx:1.27-alpine', ports: [{containerPort: 80}], readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 5}, volumeMounts: [{name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}]}
      volumes: [{name: config, configMap: {name: phase09-gateway-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: phase09-app}
spec: {selector: {app: gateway}, ports: [{port: 80, targetPort: 80}]}